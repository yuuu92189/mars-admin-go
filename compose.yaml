name: mars-admin-go

services:
  postgres:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: mars_admin
      POSTGRES_USER: mars
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mars_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mars -d mars_admin"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8.10.1-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      args:
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-alpine:3.22}
    entrypoint: ["/usr/local/bin/migrate"]
    command: ["up"]
    environment:
      DATABASE_URL: postgres://mars:${POSTGRES_PASSWORD:-mars_dev_only}@postgres:5432/mars_admin?sslmode=disable
      AUTO_MIGRATE: "false"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      args:
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-alpine:3.22}
    environment:
      APP_ENV: development
      APP_NAME: Mars Admin Go Edition
      APP_VERSION: 0.1.0
      APP_PORT: "8080"
      APP_LOG_LEVEL: info
      APP_SHUTDOWN_TIMEOUT: 20s
      APP_PUBLIC_BASE_URL: http://localhost:8080
      APP_CORS_ORIGINS: http://localhost:3000,http://localhost:3001
      AUTO_MIGRATE: "false"
      DATABASE_URL: postgres://mars:${POSTGRES_PASSWORD:-mars_dev_only}@postgres:5432/mars_admin?sslmode=disable
      DATABASE_MAX_CONNECTIONS: "20"
      DATABASE_MIN_CONNECTIONS: "2"
      DATABASE_CONNECTION_TIMEOUT: 10s
      REDIS_URL: redis://redis:6379/0
      REDIS_POOL_SIZE: "10"
      AUTH_SESSION_TTL: 30m
      AUTH_REFRESH_TTL: 720h
      AUTH_COOKIE_SECURE: "false"
      AUTH_COOKIE_SAME_SITE: lax
      AUTH_LOGIN_MAX_ATTEMPTS: "5"
      AUTH_LOGIN_LOCK_DURATION: 30m
      STORAGE_PROVIDER: local
      STORAGE_LOCAL_DIR: /app/uploads
      STORAGE_PUBLIC_BASE_URL: http://localhost:8080/files
      STORAGE_MAX_UPLOAD_BYTES: "52428800"
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.invalid}
    volumes:
      - uploads:/app/uploads
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      args:
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-alpine:3.22}
    entrypoint: ["/usr/local/bin/worker"]
    healthcheck:
      disable: true
    environment:
      APP_ENV: development
      APP_NAME: Mars Admin Go Edition
      APP_VERSION: 0.1.0
      APP_LOG_LEVEL: info
      APP_SHUTDOWN_TIMEOUT: 20s
      AUTO_MIGRATE: "false"
      DATABASE_URL: postgres://mars:${POSTGRES_PASSWORD:-mars_dev_only}@postgres:5432/mars_admin?sslmode=disable
      DATABASE_MAX_CONNECTIONS: "10"
      DATABASE_MIN_CONNECTIONS: "1"
      DATABASE_CONNECTION_TIMEOUT: 10s
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  uploads:
