openapi: 3.1.0
info:
  title: Mars Admin Go Edition API
  version: 0.1.0
  description: |
    Canonical API contract for Mars Admin Go Edition. Legacy `/api/*` routes are
    compatibility adapters only and call the same application services.
servers:
  - url: http://localhost:8080
tags:
  - name: Auth
  - name: Identity
  - name: Access
  - name: Organization
  - name: System
  - name: Audit
  - name: Storage
  - name: Messaging
  - name: Notification
  - name: Scheduler
  - name: Workflow
  - name: Codegen
  - name: Monitoring
  - name: Integrations
security:
  - bearerAuth: []
  - sessionCookie: []
paths:
  /health/live:
    get:
      operationId: healthLive
      security: []
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health/ready:
    get:
      operationId: healthReady
      security: []
      responses:
        "200":
          description: Dependencies are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          $ref: "#/components/responses/Problem"
  /metrics:
    get:
      operationId: metrics
      x-required-permission: audit:read
      responses:
        "200":
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "500":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/captcha:
    get:
      tags: [Auth]
      operationId: issueCaptcha
      security: []
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [image, slider]
            default: image
      responses:
        "200":
          description: Captcha challenge
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                    format: uuid
                  img:
                    type: string
                  piece:
                    type: string
                  targetY:
                    type: integer
                  slider:
                    type: boolean
  /api/v1/auth/sms-code:
    post:
      tags: [Auth]
      operationId: sendLoginSMS
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
      responses:
        "202":
          description: Code sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SMSCodeResult"
        "429":
          $ref: "#/components/responses/Problem"
        "501":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/login/sms:
    post:
      tags: [Auth]
      operationId: loginSMS
      security: []
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
  /api/v1/auth/mfa/setup:
    post:
      tags: [Auth]
      operationId: setupMFA
      x-auth-required: true
      responses:
        "200":
          description: TOTP secret and provisioning URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFASetup"
        "501":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/mfa/enable:
    post:
      tags: [Auth]
      operationId: enableMFA
      x-auth-required: true
      responses:
        "204":
          description: MFA enabled
        "401":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/mfa/disable:
    post:
      tags: [Auth]
      operationId: disableMFA
      x-auth-required: true
      responses:
        "204":
          description: MFA disabled
        "401":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Rotated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "401":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      x-auth-required: true
      responses:
        "204":
          description: Session revoked
        "401":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: currentUser
      x-auth-required: true
      responses:
        "200":
          description: Current user, roles, permissions and menus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Problem"
  /api/v1/admin/users:
    get:
      tags: [Identity]
      operationId: listUsers
      x-required-permission: user:read
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: keyword
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: User page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      tags: [Identity]
      operationId: createUser
      x-required-permission: user:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUser"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/admin/users/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Identity]
      operationId: getUser
      x-required-permission: user:read
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      tags: [Identity]
      operationId: updateUser
      x-required-permission: user:update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUser"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [Identity]
      operationId: deleteUser
      x-required-permission: user:delete
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/admin/access/roles:
    get:
      tags: [Access]
      operationId: listRoles
      x-required-permission: role:read
      responses:
        "200":
          description: Role page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolePage"
    post:
      tags: [Access]
      operationId: createRole
      x-required-permission: role:create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRole"
      responses:
        "201":
          description: Created role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
  /api/v1/admin/organization/departments:
    get:
      tags: [Organization]
      operationId: listDepartments
      x-required-permission: department:read
      responses:
        "200":
          description: Department tree
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Department"
    post:
      tags: [Organization]
      operationId: createDepartment
      x-required-permission: department:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentInput"
      responses:
        "201":
          description: Created department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
  /api/v1/admin/dictionaries:
    get:
      tags: [System]
      operationId: listDictionaries
      x-required-permission: dictionary:read
      responses:
        "200":
          description: Dictionary types
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DictionaryTypePage"
  /api/v1/admin/settings/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [System]
      operationId: getSettingGroup
      x-required-permission: settings:read
      responses:
        "200":
          description: Setting group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingGroup"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      tags: [System]
      operationId: updateSettingGroup
      x-required-permission: settings:manage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Updated setting group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingGroup"
  /api/v1/admin/audit/events:
    get:
      tags: [Audit]
      operationId: listAuditEvents
      x-required-permission: audit:read
      responses:
        "200":
          description: Audit event page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
  /api/v1/files:
    get:
      tags: [Storage]
      operationId: listFiles
      x-required-permission: file:download
      responses:
        "200":
          description: File page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FilePage"
    post:
      tags: [Storage]
      operationId: uploadFile
      x-required-permission: file:upload
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                groupId:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Uploaded file
          content:
            application/json:
              schema:
                type: object
                required: [file, url]
                properties:
                  file:
                    $ref: "#/components/schemas/File"
                  url:
                    type: string
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/files/{id}/download:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Storage]
      operationId: downloadFile
      x-required-permission: file:download
      responses:
        "200":
          description: File bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/messages:
    post:
      tags: [Messaging]
      operationId: sendDirectMessage
      x-required-permission: message:send
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessage"
      responses:
        "201":
          description: Persisted message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /api/v1/messages/{peerId}:
    parameters:
      - name: peerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Messaging]
      operationId: directMessageHistory
      x-required-permission: message:read
      parameters:
        - name: before
          in: query
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Message history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
  /api/v1/groups:
    get:
      tags: [Messaging]
      operationId: listGroups
      x-required-permission: message:read
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Group"
    post:
      tags: [Messaging]
      operationId: createGroup
      x-required-permission: message:send
      responses:
        "201":
          description: Created group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
  /api/v1/notices:
    get:
      tags: [Notification]
      operationId: listNotices
      x-required-permission: notice:read
      responses:
        "200":
          description: Notice page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NoticePage"
    post:
      tags: [Notification]
      operationId: createNotice
      x-required-permission: notice:manage
      responses:
        "201":
          description: Draft notice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notice"
  /api/v1/notices/{id}/read:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Notification]
      operationId: readNotice
      x-required-permission: notice:read
      responses:
        "204":
          description: Marked read
  /api/v1/admin/scheduler/jobs:
    get:
      tags: [Scheduler]
      operationId: listScheduledJobs
      x-required-permission: scheduler:read
      responses:
        "200":
          description: Scheduled job page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledJobPage"
    post:
      tags: [Scheduler]
      operationId: createScheduledJob
      x-required-permission: scheduler:manage
      responses:
        "201":
          description: Scheduled job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledJob"
  /api/v1/admin/scheduler/jobs/{id}/run:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Scheduler]
      operationId: runScheduledJob
      x-required-permission: scheduler:manage
      responses:
        "202":
          description: River job queued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledJobRun"
  /api/v1/workflows/definitions:
    get:
      tags: [Workflow]
      operationId: listWorkflowDefinitions
      x-required-permission: workflow:read
      responses:
        "200":
          description: Workflow definition page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDefinitionPage"
    post:
      tags: [Workflow]
      operationId: createWorkflowDefinition
      x-required-permission: workflow:manage
      responses:
        "201":
          description: Created definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDefinition"
  /api/v1/workflows/instances:
    get:
      tags: [Workflow]
      operationId: listWorkflowInstances
      x-required-permission: workflow:read
      responses:
        "200":
          description: Workflow instance page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowInstancePage"
    post:
      tags: [Workflow]
      operationId: startWorkflowInstance
      x-required-permission: workflow:manage
      responses:
        "201":
          description: Started instance and initial task
          content:
            application/json:
              schema:
                type: object
                properties:
                  instance:
                    $ref: "#/components/schemas/WorkflowInstance"
                  task:
                    $ref: "#/components/schemas/WorkflowTask"
  /api/v1/workflows/tasks/{action}:
    parameters:
      - name: action
        in: path
        required: true
        schema:
          type: string
          enum: [approve, reject]
    post:
      tags: [Workflow]
      operationId: decideWorkflowTask
      x-required-permission: workflow:approve
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taskId]
              properties:
                taskId:
                  type: string
                  format: uuid
                comment:
                  type: string
                variables:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Updated task and instance
          content:
            application/json:
              schema:
                type: object
                properties:
                  task:
                    $ref: "#/components/schemas/WorkflowTask"
                  instance:
                    $ref: "#/components/schemas/WorkflowInstance"
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/admin/codegen/tables:
    get:
      tags: [Codegen]
      operationId: listDatabaseTables
      x-required-permission: codegen:read
      responses:
        "200":
          description: PostgreSQL tables
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CodegenTable"
  /api/v1/admin/codegen/preview:
    post:
      tags: [Codegen]
      operationId: previewGeneratedCode
      x-required-permission: codegen:manage
      responses:
        "200":
          description: Generated file preview
          content:
            application/json:
              schema:
                type: object
                required: [files, activeFile, code]
                properties:
                  files:
                    type: array
                    items:
                      type: object
                      required: [name, path, code]
                      properties:
                        name:
                          type: string
                        path:
                          type: string
                        code:
                          type: string
                  activeFile:
                    type: string
                  code:
                    type: string
  /api/v1/admin/monitoring/snapshot:
    get:
      tags: [Monitoring]
      operationId: monitoringSnapshot
      x-required-permission: audit:read
      responses:
        "200":
          description: Runtime and dependency snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonitoringSnapshot"
  /api/v1/auth/social/{provider}:
    parameters: [{ name: provider, in: path, required: true, schema: { type: string } }]
    post:
      tags: [Auth]
      operationId: socialLogin
      security: []
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
  /api/v1/auth/social-identities/unbind:
    post:
      tags: [Auth]
      operationId: unbindSocialIdentity
      x-auth-required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, subject]
              properties:
                provider: { type: string, maxLength: 40 }
                subject: { type: string, maxLength: 255 }
      responses:
        "204": { description: Social identity unbound }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      security: []
      responses:
        "201":
          description: Registered user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/login-types:
    get:
      tags: [Auth]
      operationId: loginTypes
      security: []
      responses:
        "200":
          description: Enabled login methods
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /api/v1/auth/info:
    get:
      tags: [Auth]
      operationId: currentUserInfo
      x-auth-required: true
      responses:
        "200":
          description: Current user, roles, permissions and menus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
  /api/v1/auth/profile:
    get:
      tags: [Auth]
      operationId: getProfile
      x-auth-required: true
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    put:
      tags: [Auth]
      operationId: updateProfile
      x-auth-required: true
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /api/v1/auth/password:
    post:
      tags: [Auth]
      operationId: changePassword
      x-auth-required: true
      responses: { "204": { description: Password changed }, "422": { $ref: "#/components/responses/Problem" } }
  /api/v1/auth/sessions:
    get:
      tags: [Auth]
      operationId: listSessions
      x-auth-required: true
      responses:
        "200":
          description: Active sessions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
  /api/v1/auth/sessions/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    delete:
      tags: [Auth]
      operationId: revokeSession
      x-auth-required: true
      responses: { "204": { description: Session revoked } }
  /api/v1/admin/users/{id}/reset-password:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [Identity]
      operationId: resetUserPassword
      x-required-permission: user:update
      responses:
        "200":
          description: Temporary password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemporaryPassword"
  /api/v1/admin/users/{id}/revoke-sessions:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [Identity]
      operationId: revokeUserSessions
      x-required-permission: user:update
      responses: { "204": { description: Sessions revoked } }
  /api/v1/admin/access/roles/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      tags: [Access]
      operationId: updateRole
      x-required-permission: role:create
      responses:
        "200":
          description: Updated role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
    delete:
      tags: [Access]
      operationId: deleteRole
      x-required-permission: role:create
      responses: { "204": { description: Role deleted } }
  /api/v1/admin/access/roles/{id}/menus:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Access]
      operationId: getRoleMenus
      x-required-permission: role:read
      responses:
        "200":
          description: Assigned menu ids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleMenuIDs"
    put:
      tags: [Access]
      operationId: setRoleMenus
      x-required-permission: role:assign
      responses: { "204": { description: Role menus updated } }
  /api/v1/admin/access/roles/{id}/permissions:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      tags: [Access]
      operationId: setRolePermissions
      x-required-permission: role:assign
      responses: { "204": { description: Role permissions updated } }
  /api/v1/admin/access/permissions:
    get:
      tags: [Access]
      operationId: listPermissions
      x-required-permission: role:read
      responses:
        "200":
          description: Permission catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Permission"
  /api/v1/admin/access/menus:
    get:
      tags: [Access]
      operationId: listMenus
