openapi: 3.1.0
info:
  title: Mars Admin Go Edition API
  version: 0.1.0
  description: |
    Canonical API contract for Mars Admin Go Edition. Legacy `/api/*` routes are
    compatibility adapters only and call the same application services.
servers:
  - url: http://localhost:8080
tags:
  - name: Auth
  - name: Identity
  - name: Access
  - name: Organization
  - name: System
  - name: Audit
  - name: Storage
  - name: Messaging
  - name: Notification
  - name: Scheduler
  - name: Workflow
  - name: Codegen
  - name: Monitoring
  - name: Integrations
security:
  - bearerAuth: []
  - sessionCookie: []
paths:
  /health/live:
    get:
      operationId: healthLive
      security: []
      responses:
        "200":
          description: Process is alive
  /health/ready:
    get:
      operationId: healthReady
      security: []
      responses:
        "200":
          description: Dependencies are ready
        "503":
          $ref: "#/components/responses/Problem"
  /metrics:
    get:
      operationId: metrics
      security: []
      responses:
        "200":
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string
  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "401":
          $ref: "#/components/responses/Problem"
        "429":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/captcha:
    get:
      tags: [Auth]
      operationId: issueCaptcha
      security: []
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [image, slider]
            default: image
      responses:
        "200":
          description: Captcha challenge
          content:
            application/json:
              schema:
                type: object
                properties:
                  uuid:
                    type: string
                    format: uuid
                  img:
                    type: string
                  piece:
                    type: string
                  targetY:
                    type: integer
                  slider:
                    type: boolean
  /api/v1/auth/sms-code:
    post:
      tags: [Auth]
      operationId: sendLoginSMS
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
      responses:
        "202":
          description: Code sent
        "429":
          $ref: "#/components/responses/Problem"
        "501":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/login/sms:
    post:
      tags: [Auth]
      operationId: loginSMS
      security: []
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
  /api/v1/auth/mfa/setup:
    post:
      tags: [Auth]
      operationId: setupMFA
      responses:
        "200":
          description: TOTP secret and provisioning URL
        "501":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/mfa/enable:
    post:
      tags: [Auth]
      operationId: enableMFA
      responses:
        "204":
          description: MFA enabled
        "401":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/mfa/disable:
    post:
      tags: [Auth]
      operationId: disableMFA
      responses:
        "204":
          description: MFA disabled
        "401":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      security: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: Rotated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResult"
        "401":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      responses:
        "204":
          description: Session revoked
        "401":
          $ref: "#/components/responses/Problem"
  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: currentUser
      responses:
        "200":
          description: Current user, roles, permissions and menus
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        "401":
          $ref: "#/components/responses/Problem"
  /api/v1/admin/users:
    get:
      tags: [Identity]
      operationId: listUsers
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: keyword
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: User page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPage"
        "403":
          $ref: "#/components/responses/Problem"
    post:
      tags: [Identity]
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUser"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/admin/users/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Identity]
      operationId: getUser
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      tags: [Identity]
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUser"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          $ref: "#/components/responses/Problem"
    delete:
      tags: [Identity]
      operationId: deleteUser
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/admin/access/roles:
    get:
      tags: [Access]
      operationId: listRoles
      responses:
        "200":
          description: Role page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RolePage"
    post:
      tags: [Access]
      operationId: createRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRole"
      responses:
        "201":
          description: Created role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
  /api/v1/admin/organization/departments:
    get:
      tags: [Organization]
      operationId: listDepartments
      responses:
        "200":
          description: Department tree
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Department"
    post:
      tags: [Organization]
      operationId: createDepartment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentInput"
      responses:
        "201":
          description: Created department
  /api/v1/admin/dictionaries:
    get:
      tags: [System]
      operationId: listDictionaries
      responses:
        "200":
          description: Dictionary types
  /api/v1/admin/settings/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [System]
      operationId: getSettingGroup
      responses:
        "200":
          description: Setting group
        "404":
          $ref: "#/components/responses/Problem"
    put:
      tags: [System]
      operationId: updateSettingGroup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Updated setting group
  /api/v1/admin/audit/events:
    get:
      tags: [Audit]
      operationId: listAuditEvents
      responses:
        "200":
          description: Audit event page
  /api/v1/files:
    get:
      tags: [Storage]
      operationId: listFiles
      responses:
        "200":
          description: File page
    post:
      tags: [Storage]
      operationId: uploadFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                groupId:
                  type: string
                  format: uuid
      responses:
        "201":
          description: Uploaded file
        "422":
          $ref: "#/components/responses/Problem"
  /api/v1/files/{id}/download:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Storage]
      operationId: downloadFile
      responses:
        "200":
          description: File bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/Problem"
  /api/v1/messages:
    post:
      tags: [Messaging]
      operationId: sendDirectMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessage"
      responses:
        "201":
          description: Persisted message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /api/v1/messages/{peerId}:
    parameters:
      - name: peerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Messaging]
      operationId: directMessageHistory
      parameters:
        - name: before
          in: query
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Message history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
  /api/v1/groups:
    get:
      tags: [Messaging]
      operationId: listGroups
      responses:
        "200":
          description: Groups
    post:
      tags: [Messaging]
      operationId: createGroup
      responses:
        "201":
          description: Created group
  /api/v1/notices:
    get:
      tags: [Notification]
      operationId: listNotices
      responses:
        "200":
          description: Notice page
    post:
      tags: [Notification]
      operationId: createNotice
      responses:
        "201":
          description: Draft notice
  /api/v1/notices/{id}/read:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Notification]
      operationId: readNotice
      responses:
        "204":
          description: Marked read
  /api/v1/admin/scheduler/jobs:
    get:
      tags: [Scheduler]
      operationId: listScheduledJobs
      responses:
        "200":
          description: Scheduled job page
    post:
      tags: [Scheduler]
      operationId: createScheduledJob
      responses:
        "201":
          description: Scheduled job
  /api/v1/admin/scheduler/jobs/{id}/run:
    parameters:
      - $ref: "#/components/parameters/Id"
    post:
      tags: [Scheduler]
      operationId: runScheduledJob
      responses:
        "202":
          description: River job queued
  /api/v1/workflows/definitions:
    get:
      tags: [Workflow]
      operationId: listWorkflowDefinitions
      responses:
        "200":
          description: Workflow definition page
    post:
      tags: [Workflow]
      operationId: createWorkflowDefinition
      responses:
        "201":
          description: Created definition
  /api/v1/workflows/instances:
    get:
      tags: [Workflow]
      operationId: listWorkflowInstances
      responses:
        "200":
          description: Workflow instance page
    post:
      tags: [Workflow]
      operationId: startWorkflowInstance
      responses:
        "201":
          description: Started instance and initial task
  /api/v1/workflows/tasks/{action}:
    parameters:
      - name: action
        in: path
        required: true
        schema:
          type: string
          enum: [approve, reject]
    post:
      tags: [Workflow]
      operationId: decideWorkflowTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [taskId]
              properties:
                taskId:
                  type: string
                  format: uuid
                comment:
                  type: string
                variables:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Updated task and instance
        "409":
          $ref: "#/components/responses/Problem"
  /api/v1/admin/codegen/tables:
    get:
      tags: [Codegen]
      operationId: listDatabaseTables
      responses:
        "200":
          description: PostgreSQL tables
  /api/v1/admin/codegen/preview:
    post:
      tags: [Codegen]
      operationId: previewGeneratedCode
      responses:
        "200":
          description: Generated file preview
  /api/v1/admin/monitoring/snapshot:
    get:
      tags: [Monitoring]
      operationId: monitoringSnapshot
      responses:
        "200":
          description: Runtime and dependency snapshot
  /api/v1/auth/social/{provider}:
    parameters: [{ name: provider, in: path, required: true, schema: { type: string } }]
    post:
      tags: [Auth]
      operationId: socialLogin
      security: []
      responses: { "200": { description: Authenticated } }
  /api/v1/auth/register:
    post:
      tags: [Auth]
      operationId: registerUser
      security: []
      responses: { "201": { description: Registered user }, "422": { $ref: "#/components/responses/Problem" } }
  /api/v1/auth/login-types:
    get:
      tags: [Auth]
      operationId: loginTypes
      security: []
      responses: { "200": { description: Enabled login methods } }
  /api/v1/auth/info:
    get:
      tags: [Auth]
      operationId: currentUserInfo
      responses: { "200": { description: "Current user, roles, permissions and menus" } }
  /api/v1/auth/profile:
    get:
      tags: [Auth]
      operationId: getProfile
      responses: { "200": { description: Current user profile } }
    put:
      tags: [Auth]
      operationId: updateProfile
      responses: { "200": { description: Updated profile } }
  /api/v1/auth/password:
    post:
      tags: [Auth]
      operationId: changePassword
      responses: { "204": { description: Password changed }, "422": { $ref: "#/components/responses/Problem" } }
  /api/v1/auth/sessions:
    get:
      tags: [Auth]
      operationId: listSessions
      responses: { "200": { description: Active sessions } }
  /api/v1/auth/sessions/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    delete:
      tags: [Auth]
      operationId: revokeSession
      responses: { "204": { description: Session revoked } }
  /api/v1/admin/users/{id}/reset-password:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [Identity]
      operationId: resetUserPassword
      responses: { "200": { description: Temporary password } }
  /api/v1/admin/users/{id}/revoke-sessions:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [Identity]
      operationId: revokeUserSessions
      responses: { "204": { description: Sessions revoked } }
  /api/v1/admin/access/roles/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      tags: [Access]
      operationId: updateRole
      responses: { "200": { description: Updated role } }
    delete:
      tags: [Access]
      operationId: deleteRole
      responses: { "204": { description: Role deleted } }
  /api/v1/admin/access/roles/{id}/menus:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Access]
      operationId: getRoleMenus
      responses: { "200": { description: Assigned menu ids } }
    put:
      tags: [Access]
      operationId: setRoleMenus
      responses: { "204": { description: Role menus updated } }
  /api/v1/admin/access/roles/{id}/permissions:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      tags: [Access]
      operationId: setRolePermissions
      responses: { "204": { description: Role permissions updated } }
  /api/v1/admin/access/permissions:
    get:
      tags: [Access]
      operationId: listPermissions
      responses: { "200": { description: Permission catalog } }
  /api/v1/admin/access/menus:
    get:
      tags: [Access]
      operationId: listMenus
      responses: { "200": { description: Visible menu tree } }
    post:
      tags: [Access]
      operationId: createMenu
      responses: { "201": { description: Created menu } }
  /api/v1/admin/access/menus/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      tags: [Access]
      operationId: updateMenu
      responses: { "200": { description: Updated menu } }
    delete:
      tags: [Access]
      operationId: deleteMenu
      responses: { "204": { description: Menu deleted } }
  /api/v1/admin/organization/departments/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Organization]
      operationId: getDepartment
      responses: { "200": { description: Department } }
    put:
      tags: [Organization]
      operationId: updateDepartment
      responses: { "200": { description: Updated department } }
    delete:
      tags: [Organization]
      operationId: deleteDepartment
      responses: { "204": { description: Department deleted } }
  /api/v1/admin/organization/positions:
    get:
      tags: [Organization]
      operationId: listPositions
      responses: { "200": { description: Position list } }
    post:
      tags: [Organization]
      operationId: createPosition
      responses: { "201": { description: Created position } }
  /api/v1/admin/organization/positions/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      tags: [Organization]
      operationId: updatePosition
      responses: { "200": { description: Updated position } }
    delete:
      tags: [Organization]
      operationId: deletePosition
      responses: { "204": { description: Position deleted } }
  /api/v1/admin/dictionaries/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [System]
      operationId: listDictionaryItems
      responses: { "200": { description: Dictionary items } }
    put:
      tags: [System]
      operationId: updateDictionary
      responses: { "200": { description: Updated dictionary } }
    delete:
      tags: [System]
      operationId: deleteDictionary
      responses: { "204": { description: Dictionary deleted } }
  /api/v1/admin/dictionaries/items:
    post:
      tags: [System]
      operationId: createDictionaryItem
      responses: { "201": { description: Created dictionary item } }
  /api/v1/admin/dictionaries/items/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      tags: [System]
      operationId: updateDictionaryItem
      responses: { "200": { description: Updated dictionary item } }
    delete:
      tags: [System]
      operationId: deleteDictionaryItem
      responses: { "204": { description: Dictionary item deleted } }
  /api/v1/admin/settings/public:
    get:
      tags: [System]
      operationId: publicSettings
      security: []
      responses: { "200": { description: Public settings } }
  /api/v1/admin/settings:
    get:
      tags: [System]
      operationId: listSettingGroups
      responses: { "200": { description: Setting groups } }
  /api/v1/admin/audit/logins:
    get:
      tags: [Audit]
      operationId: listLoginEvents
      responses: { "200": { description: Login event page } }
  /api/v1/files/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Storage]
      operationId: getFile
      responses: { "200": { description: File metadata } }
    delete:
      tags: [Storage]
      operationId: deleteFile
      responses: { "204": { description: File deleted } }
  /api/v1/messages/users:
    get:
      tags: [Messaging]
      operationId: listMessageUsers
      responses: { "200": { description: Available chat users } }
  /api/v1/messages/unread:
    get:
      tags: [Messaging]
      operationId: messageUnreadCounts
      responses: { "200": { description: Unread message counts } }
  /api/v1/messages/{peerId}/read:
    parameters: [{ name: peerId, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [Messaging]
      operationId: markMessagesRead
      responses: { "204": { description: Messages marked read } }
  /api/v1/messages/block/{targetId}:
    parameters: [{ name: targetId, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [Messaging]
      operationId: blockChatUser
      responses: { "204": { description: User blocked } }
    delete:
      tags: [Messaging]
      operationId: unblockChatUser
      responses: { "204": { description: User unblocked } }
  /api/v1/messages/blocked:
    get:
      tags: [Messaging]
      operationId: listBlockedChatUsers
      responses: { "200": { description: Blocked users } }
  /api/v1/groups/{groupId}:
    parameters: [{ name: groupId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Messaging]
      operationId: getGroup
      responses: { "200": { description: Group details } }
    delete:
      tags: [Messaging]
      operationId: dissolveGroup
      responses: { "204": { description: Group dissolved } }
  /api/v1/groups/{groupId}/members:
    parameters: [{ name: groupId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Messaging]
      operationId: listGroupMembers
      responses: { "200": { description: Group members } }
    post:
      tags: [Messaging]
      operationId: addGroupMembers
      responses: { "204": { description: Members added } }
  /api/v1/groups/{groupId}/messages:
    parameters: [{ name: groupId, in: path, required: true, schema: { type: string, format: uuid } }]
    get:
      tags: [Messaging]
      operationId: listGroupMessages
      responses: { "200": { description: Group message history } }
    post:
      tags: [Messaging]
      operationId: sendGroupMessage
      responses: { "201": { description: Group message created } }
  /api/v1/groups/{groupId}/quit:
    parameters: [{ name: groupId, in: path, required: true, schema: { type: string, format: uuid } }]
    post:
      tags: [Messaging]
      operationId: quitGroup
      responses: { "204": { description: Left group } }
  /api/v1/notices/my:
    get:
      tags: [Notification]
      operationId: listMyNotices
      responses: { "200": { description: Current user notifications } }
  /api/v1/notices/unread:
    get:
      tags: [Notification]
      operationId: noticeUnreadCounts
      responses: { "200": { description: Unread notice counts } }
  /api/v1/notices/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Notification]
      operationId: getNotice
      responses: { "200": { description: Notice } }
    put:
      tags: [Notification]
      operationId: updateNotice
      responses: { "200": { description: Updated notice } }
  /api/v1/notices/{id}/publish:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [Notification]
      operationId: publishNotice
      responses: { "204": { description: Notice published } }
  /api/v1/notices/{id}/withdraw:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [Notification]
      operationId: withdrawNotice
      responses: { "204": { description: Notice withdrawn } }
