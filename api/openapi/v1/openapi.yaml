components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    sessionCookie:
      type: apiKey
      in: cookie
      name: mars_session
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        requestId:
          type: string
        traceId:
          type: string
    LoginRequest:
      type: object
      description: Password login is the default. SMS and social login use the optional loginType and provider fields.
      anyOf:
        - required: [username, password]
        - required: [phone, smsCode]
        - required: [authCode]
        - required: [wxCode]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        clientType:
          type: string
          enum: [admin, web, app]
        deviceName:
          type: string
        rememberMe:
          type: boolean
        mfaCode:
          type: string
        captchaId:
          type: string
