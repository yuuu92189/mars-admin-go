components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    sessionCookie:
      type: apiKey
      in: cookie
      name: mars_session
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        requestId:
          type: string
        traceId:
          type: string
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        clientType:
          type: string
          enum: [admin, web, app]
        deviceName:
          type: string
        rememberMe:
          type: boolean
        mfaCode:
          type: string
    LoginResult:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        refreshToken:
          type: string
        csrfToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"
        access:
          $ref: "#/components/schemas/Access"
    Access:
      type: object
      properties:
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
    User:
      type: object
      required: [id, username, displayName, userType, status]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        email:
          type: string
        phone:
          type: string
        avatarUrl:
          type: string
        userType:
          type: string
        status:
          type: string
        gender:
          type: integer
        version:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
    UserPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
        total:
          type: integer
          format: int64
        page:
          type: integer
        pageSize:
          type: integer
    CreateUser:
      type: object
      required: [username, password, displayName]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        displayName:
          type: string
        email:
          type: string
        phone:
          type: string
        avatarUrl:
          type: string
        status:
          type: string
        gender:
          type: integer
        userType:
          type: string
        roleIds:
          type: array
          items:
            type: string
            format: uuid
    UpdateUser:
      type: object
      required: [displayName, version]
      properties:
        displayName:
          type: string
        email:
          type: string
        phone:
          type: string
        avatarUrl:
          type: string
        userType:
          type: string
        status:
          type: string
        gender:
          type: integer
        version:
          type: integer
          format: int64
    CurrentUser:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        menus:
          type: array
          items:
            type: object
            additionalProperties: true
    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
        dataScope:
          type: string
        status:
          type: string
    RolePage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        total:
          type: integer
          format: int64
    CreateRole:
      type: object
      required: [name, code, dataScope]
      properties:
        name:
          type: string
        code:
          type: string
        description:
          type: string
        dataScope:
          type: string
          enum: [all, custom, department, department_tree, self]
    Department:
      type: object
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
        path:
          type: string
        children:
          type: array
          items:
            $ref: "#/components/schemas/Department"
    DepartmentInput:
      type: object
      required: [name, code]
      properties:
        parentId:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
        leaderName:
          type: string
        phone:
          type: string
        email:
          type: string
        sort:
          type: integer
        status:
          type: string
          enum: [active, disabled]
    SendMessage:
      type: object
      required: [receiverId, content]
      properties:
        receiverId:
          type: string
          format: uuid
        clientMessageId:
          type: string
        messageType:
          type: string
          enum: [text, image, file]
        content:
          type: string
          maxLength: 10000
        metadata:
          type: object
          additionalProperties: true
    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        senderId:
          type: string
          format: uuid
        receiverId:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        messageType:
          type: string
        content:
          type: string
        sequence:
          type: integer
          format: int64
        createdAt:
          type: string
          format: date-time
