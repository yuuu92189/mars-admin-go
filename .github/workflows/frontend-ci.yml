name: Frontend CI

on:
  push:
    paths:
      - "frontend/**"
      - "frontend-api/**"
      - "api/openapi/v1/openapi.yaml"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "frontend-api/**"
      - "api/openapi/v1/openapi.yaml"
      - ".github/workflows/frontend-ci.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - name: Check generated OpenAPI types
        run: |
          npm ci --prefix ../frontend-api
          npm --prefix ../frontend-api run check
          git diff --exit-code ../frontend-api/src/schema.ts
